apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../guides/recipes/modelserver/base/single-host/default

namePrefix: exp1-sglang-heuristic-

images:
  - name: REPLACE_MODEL_SERVER_IMAGE
    newName: docker.io/lmsysorg/sglang
    newTag: v0.5.10.post1

labels:
  - pairs:
      llm-d.ai/experiment: sglang-routing-gap
      llm-d.ai/routing-config: llmd-heuristic
      llm-d.ai/model: Qwen2.5-7B
    includeSelectors: true
    includeTemplates: true
    fields:
      - version: v1
        kind: ServiceAccount
        path: metadata/labels
        create: true
      - group: apps
        version: v1
        kind: Deployment
        path: metadata/labels
        create: true
      - group: apps
        version: v1
        kind: Deployment
        path: spec/selector/matchLabels
        create: true
      - group: apps
        version: v1
        kind: Deployment
        path: spec/template/metadata/labels
        create: true

patches:
  - path: patch-sglang.yaml
